<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Моят Профил - Car Rental</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #0284c7;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: #334155; margin: 0; padding: 0; }
        nav { background-color: var(--primary-color); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 600; }
        .container { max-width: 1000px; margin: 40px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
        h2, h3 { color: var(--primary-color); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f1f5f9; color: var(--primary-color); font-weight: 600; }
        .btn-danger { background-color: var(--danger-color); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-danger:hover { background-color: #b91c1c; }
        .alert-success { background-color: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

<nav>
    <div><strong>🚗 Car Rental System</strong></div>
    <div>
        <a th:href="@{/cars/all}">Към каталога</a>
        <a th:href="@{/}">Начало</a>
    </div>
</nav>

<div class="container">
    <h2>Профил на потребител: <span th:text="${username}" style="color: var(--accent-color);">Username</span></h2>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <h3>Моите наети автомобили</h3>

    <div th:if="${rentedCars == null or rentedCars.empty}">
        <p style="color: #64748b;">Все още нямате наети автомобили.</p>
    </div>

    <table th:if="${rentedCars != null and !rentedCars.empty}">
        <thead>
        <tr>
            <th>Марка</th>
            <th>Модел</th>
            <th>Рег. Номер</th>
            <th>Цена на ден</th>
            <th>Действие</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car : ${rentedCars}">
            <td th:text="${car.make}">Марка</td>
            <td th:text="${car.model}">Модел</td>
            <td th:text="${car.registrationNumber}">Рег. номер</td>
            <td th:text="${car.pricePerDay} + ' лв.'">Цена</td>
            <td>
                <form th:action="@{/cars/return/{id}(id=${car.id})}" method="post" style="margin: 0;">
                    <button type="submit" class="btn-danger">Върни автомобила</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
