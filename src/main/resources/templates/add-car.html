<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добави Автомобил - Car Rental</title>
</head>
<body>
<h2>Добавяне на нов автомобил</h2>

<form th:action="@{/cars/add}" th:object="${vehicleAddDTO}" method="POST">
    <div>
        <label for="make">Марка:</label>
        <input type="text" id="make" th:field="*{make}" />
        <small th:if="${#fields.hasErrors('make')}" th:errors="*{make}" style="color: red;"></small>
    </div>
    <br>
    <div>
        <label for="model">Модел:</label>
        <input type="text" id="model" th:field="*{model}" />
        <small th:if="${#fields.hasErrors('model')}" th:errors="*{model}" style="color: red;"></small>
    </div>
    <br>
    <div>
        <label for="registrationNumber">Рег. Номер:</label>
        <input type="text" id="registrationNumber" th:field="*{registrationNumber}" />
        <small th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}" style="color: red;"></small>
    </div>
    <br>
    <div>
        <label for="pricePerDay">Цена на ден (лв):</label>
        <input type="number" step="0.01" id="pricePerDay" th:field="*{pricePerDay}" />
        <small th:if="${#fields.hasErrors('pricePerDay')}" th:errors="*{pricePerDay}" style="color: red;"></small>
    </div>
    <br>
    <button type="submit" style="background-color: green; color: white; padding: 10px;">Запази автомобила</button>
</form>

<br>
<a th:href="@{/cars/all}">Отказ (назад към каталога)</a>
</body>
</html>
