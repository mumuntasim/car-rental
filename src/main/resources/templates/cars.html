<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Автопарк - Car Rental</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #0284c7;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #334155;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05);
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .btn-success:hover {
            background-color: #15803d;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #bbf7d0;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<nav>
    <div><strong>🚗 Car Rental System</strong></div>
    <div>
        <a th:href="@{/}">Начало</a>
        <a th:href="@{/users/profile}" sec:authorize="hasRole('USER')" style="color: #38bdf8; font-weight: bold;">Моят профил</a>
    </div>
</nav>

<div class="container">
    <h2>Нашите Автомобили</h2>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}"></div>

    <div sec:authorize="hasRole('ADMIN')" style="margin-bottom: 20px;">
        <a th:href="@{/cars/add}" class="btn btn-success">
            + Добави нов автомобил
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Марка</th>
            <th>Модел</th>
            <th>Рег. Номер</th>
            <th>Цена на ден</th>
            <th sec:authorize="hasRole('USER')">Действие</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car : ${cars}">
            <td th:text="${car.make}">Марка</td>
            <td th:text="${car.model}">Модел</td>
            <td th:text="${car.registrationNumber}">Рег. номер</td>
            <td th:text="${car.pricePerDay} + ' лв.'">Цена</td>

            <!-- Бутон за наемане (само за USER) -->
            <td sec:authorize="hasRole('USER')">
                <form th:action="@{/cars/rent/{id}(id=${car.id})}" method="post" style="margin: 0;">
                    <button type="submit" class="btn">
                        Наеми автомобил
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
