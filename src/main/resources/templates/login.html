<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - Car Rental</title>
</head>
<body>
<h2>Вход в системата</h2>

<div th:if="${param.error}" style="color: red; font-weight: bold;">
    <p>Грешно потребителско име или парола!</p>
</div>

<form th:action="@{/users/login}" method="POST">
    <div>
        <label for="username">Потребителско име:</label>
        <input type="text" id="username" name="username" required />
    </div>
    <br>
    <div>
        <label for="password">Парола:</label>
        <input type="password" id="password" name="password" required />
    </div>
    <br>
    <button type="submit">Влез</button>
</form>

<p>Нямаш профил? <a th:href="@{/users/register}">Регистрирай се</a></p>
</body>
</html>
